map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
  listen 80;
  # Docker's built-in DNS. Together with the variable below, nginx looks the backend up again every few seconds, so a
  # backend that was restarted or rebuilt (new internal address) is found again instead of giving "502 Bad Gateway".
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $backend_upstream http://backend:4000;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location = /healthz { access_log off; return 200 "ok"; }

  location /api/ {
    proxy_pass $backend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /socket.io/ {
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 75s;
  }

  # hashed assets never change: cache hard. index.html must always be revalidated.
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
  location / { add_header Cache-Control "no-cache"; try_files $uri /index.html; }
}
